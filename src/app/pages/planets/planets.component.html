<app-header></app-header>

<div class="paginator">
  <a tabindex="0" class="btn elevated rounded" (click)="prevPage()" [ngClass]="prev !== '' ? '' : 'disable' ">&#xf0d9; Anterior</a>
  <a class="to-first" (click)="page = 1; getPlanetsList()" *ngIf="page > 1">&#xf100; Volver a la página 1</a>
  <span>Página {{page}} de {{meta$.totalPages}}</span>
  <a tabindex="0" class="btn elevated rounded" (click)="nextPage()" [ngClass]="next !== '' ? '' : 'disable' ">Siguiente &#xf0da;</a>
</div>

<h1 class="title"><i class="fa-solid fa-list"></i> Lista de planetas</h1>

<!-- Alert Text -->
<span *ngIf="planets$.length < 1" class="alert-text">{{alert}}</span>

<div class="planets-container">
  <div class="card" *ngFor="let planet of planets$">
    <span class="card-title">{{planet.name}}</span>
    <a class="card-image" (click)="redirectToPlanetDetails(planet.id)">
      <img src="{{planet.image}}">
    </a>
    <div class="card-content">
      <span class="stats-title">&#xf05a; Estado:</span>
      <p [textContent]="planet.isDestroyed === true ? 'Destruido' : 'Intacto'"></p>
    </div>
  </div>
</div>
